[pytest]
# --- Imports ---
# the repository root is on the path, so tests import backend and evals as packages
pythonpath = .

# --- Discovery ---
# every folder under tests is collected: unit, integration, architecture, e2e; naming one on the command line runs it alone
testpaths = tests

# --- Coverage ---
# every run measures backend and main.py as .coveragerc says and fails below its target; a run of one folder adds --no-cov
addopts = --cov --cov-report=term-missing
